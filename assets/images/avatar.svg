<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="techGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="200" height="200" rx="100" fill="#0b0f19"/>
  <circle cx="100" cy="100" r="95" fill="url(#techGlow)"/>
  <circle cx="100" cy="100" r="90" stroke="url(#cyberBorder)" stroke-width="2.5" stroke-dasharray="8 6"/>
  
  <!-- Robot/Tech Avatar Illustration -->
  <g transform="translate(40, 35)">
    <!-- Shoulders -->
    <path d="M15 110 C 25 80, 95 80, 105 110 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="42" y="70" width="36" height="22" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    
    <!-- Head -->
    <rect x="30" y="20" width="60" height="52" rx="14" fill="#0f172a" stroke="#00f2fe" stroke-width="2"/>
    <!-- Visor -->
    <rect x="38" y="34" width="44" height="18" rx="6" fill="#030712" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="43" y1="43" x2="77" y2="43" stroke="#00f2fe" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Antenna/Sensors -->
    <line x1="60" y1="20" x2="60" y2="8" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="60" cy="7" r="3" fill="#00f2fe"/>
    <circle cx="28" cy="46" r="3" fill="#10b981"/>
    <circle cx="92" cy="46" r="3" fill="#10b981"/>
  </g>
</svg>
