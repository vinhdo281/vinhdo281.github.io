u Sans, Arial, Helvetica, sans-serif" >goal pose from RViz "2D Goal Pose"</text><line x1="410.0" y1="452.0" x2="410.0" y2="530.0" stroke="#d9531e" stroke-width="2" marker-end="url(#ao)"/><text x="422.0" y="516.0" font-size="14" text-anchor="start" fill="#d9531e" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" >/cmd_vel</text><rect x="130.0" y="532.0" width="380.0" height="56.0" rx="0" fill="#fff4ee" stroke="#d9531e" stroke-width="2" /><text x="320.0" y="557.0" font-size="15" text-anchor="middle" fill="#111111" font-weight="bold" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" >relay → diff_cont</text><text x="320.0" y="577.0" font-size="13" text-anchor="middle" fill="#666666" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" >topic_tools, /diff_cont/cmd_vel_unstamped</text><path d="M 90 560 L 20 560 L 20 53 L 90 53" fill="none" stroke="#d9531e" stroke-width="2" marker-end="url(#ao)"/><text x="280.0" y="618.0" font-size="13" text-anchor="middle" fill="#666666" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" >wheel velocity commands return to Gazebo along the orange line.</text><text x="280.0" y="638.0" font-size="13" text-anchor="middle" fill="#666666" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" >teleop_twist_keyboard publishes the same /cmd_vel.</text>
