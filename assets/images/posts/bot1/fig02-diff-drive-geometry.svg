<rect width="560" height="400" fill="#ffffff"/>
<rect x="94.0" y="138.2" width="192.0" height="153.6" rx="0" fill="#f4f4f1" stroke="#111111" stroke-width="2.5" /><rect x="168.9" y="109.6" width="42.2" height="20.6" rx="0" fill="#dfe6fa" stroke="#1747c9" stroke-width="2.5" /><rect x="168.9" y="299.7" width="42.2" height="20.6" rx="0" fill="#dfe6fa" stroke="#1747c9" stroke-width="2.5" /><circle cx="260.4" cy="215.0" r="10.6" fill="#222" stroke="#111111" stroke-width="1.5"/><circle cx="241.2" cy="215.0" r="19.2" fill="#ffd9c9" stroke="#d9531e" stroke-width="2"/><circle cx="190.0" cy="215.0" r="5.0" fill="#111111" stroke="#111111" stroke-width="2"/><text x="160.9" y="125.0" font-size="16" text-anchor="end" fill="#1747c9" font-weight="bold" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" >ωL</text><text x="160.9" y="315.0" font-size="16" text-anchor="end" fill="#1747c9" font-weight="bold" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" >ωR</text><path d="M 166.0 223.0 A 25 25 0 0 1 186.0 190.0" fill="none" stroke="#1747c9" stroke-width="3" marker-end="url(#ab)"/><text x="154.0" y="193.0" font-size="20" text-anchor="end" fill="#1747c9" font-weight="bold" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" >ω</text><line x1="294.0" y1="215.0" x2="364.0" y2="215.0" stroke="#1747c9" stroke-width="4" marker-end="url(#ab)"/><text x="330.0" y="203.0" font-size="20" text-anchor="middle" fill="#1747c9" font-weight="bold" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" >v</text><line x1="60.0" y1="120.0" x2="60.0" y2="310.0" stroke="#666666" stroke-width="2" marker-start="url(#ag)" marker-end="url(#ag)"/><text x="50.0" y="220.0" font-size="14" text-anchor="end" fill="#666666" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" transform="rotate(-90 50.0 220)">W = 0.297 m</text><line x1="54.0" y1="120.0" x2="140.9" y2="120.0" stroke="#d9d9d4" stroke-width="1.5" stroke-dasharray="3 3"/><line x1="54.0" y1="310.0" x2="140.9" y2="310.0" stroke="#d9d9d4" stroke-width="1.5" stroke-dasharray="3 3"/><line x1="26.0" y1="84.0" x2="70.0" y2="84.0" stroke="#111111" stroke-width="2.5" marker-end="url(#ak)"/><text x="76.0" y="89.0" font-size="13" text-anchor="start" fill="#111111" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" >x forward</text><line x1="26.0" y1="84.0" x2="26.0" y2="44.0" stroke="#111111" stroke-width="2.5" marker-end="url(#ak)"/><text x="34.0" y="52.0" font-size="13" text-anchor="start" fill="#111111" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" >y left</text><text x="340.0" y="50.0" font-size="16" text-anchor="start" fill="#111111" font-weight="bold" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" >Forward</text><text x="340.0" y="76.0" font-size="15" text-anchor="start" fill="#111111" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" >v = R/2 (ωR + ωL)</text><text x="340.0" y="100.0" font-size="15" text-anchor="start" fill="#111111" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" >ω = R/W (ωR − ωL)</text><text x="340.0" y="150.0" font-size="16" text-anchor="start" fill="#111111" font-weight="bold" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" >Inverse</text><text x="340.0" y="176.0" font-size="15" text-anchor="start" fill="#111111" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" >ωR = (v + Wω/2)/R</text><text x="340.0" y="200.0" font-size="15" text-anchor="start" fill="#111111" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" >ωL = (v − Wω/2)/R</text><text x="340.0" y="250.0" font-size="16" text-anchor="start" fill="#111111" font-weight="bold" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" >Non-holonomic</text><text x="340.0" y="276.0" font-size="15" text-anchor="start" fill="#111111" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" >ẏ cos θ = ẋ sin θ</text><text x="340.0" y="300.0" font-size="13" text-anchor="start" fill="#666666" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" >no sideways motion</text><text x="280.0" y="388.0" font-size="13" text-anchor="middle" fill="#666666" font-weight="normal" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" >Top view drawn from the URDF numbers. R = 0.033 m, W = 0.297 m.</text>
</svg>
